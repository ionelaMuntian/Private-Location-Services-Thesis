services:
  db:
    image: postgis/postgis:16-3.4
    container_name: thesis_db
    environment:
      POSTGRES_DB: osm_ro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MiculPrint2004!
    ports:
      - "5432:5432"
    volumes:
      - thesis_db_data:/var/lib/postgresql/data

  db_auth:
    image: postgres:16
    container_name: thesis_auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AuthDbPass123!
    ports:
      - "5433:5432"
    volumes:
      - thesis_auth_db_data:/var/lib/postgresql/data

  db_users:
    image: postgres:16
    container_name: thesis_users_db
    environment:
      POSTGRES_DB: users_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: UsersDbPass123!
    ports:
      - "5434:5432"
    volumes:
      - thesis_users_db_data:/var/lib/postgresql/data

  db_company:
    image: postgres:16
    container_name: thesis_company_db
    environment:
      POSTGRES_DB: company_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CompanyDbPass123!
    ports:
      - "5435:5432"
    volumes:
      - thesis_company_db_data:/var/lib/postgresql/data

  service_provider_app:
    build:
      context: .
      dockerfile: service_provider_app/Dockerfile
    container_name: thesis_service_provider
    env_file:
      - ./service_provider_app/.env
    ports:
      - "8001:8001"
      - "50051:50051"
    volumes:
      - ./service_provider_app/app/modules/anomaly_detection/models:/models
    depends_on:
      - db

  client_app:
    build:
      context: .
      dockerfile: client_app/Dockerfile
    container_name: thesis_client
    env_file:
      - ./client_app/.env
    ports:
      - "8000:8000"
    volumes:
      - thesis_client_keys:/app/keys
      - ./service_provider_app/app/modules/anomaly_detection/models/fhe_model/client.zip:/app/.artifacts/anomaly_detection/client.zip:ro
    depends_on:
      - service_provider_app
      - db_auth
      - db_users
      - db_company

  jupyter_training:
    build:
      context: .
      dockerfile: notebooks/Dockerfile
    container_name: thesis_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./datasets:/dataset:ro
      - ./notebooks:/notebooks
      - ./service_provider_app/app/modules/anomaly_detection/models:/models
    profiles:
      - training

volumes:
  thesis_db_data:
  thesis_auth_db_data:
  thesis_users_db_data:
  thesis_company_db_data:
  thesis_client_keys:
