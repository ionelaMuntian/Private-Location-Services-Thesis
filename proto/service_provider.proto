syntax = "proto3";

package thesis;

service ServiceProviderGateway {
  rpc Call(ServiceProviderRequest) returns (ServiceProviderResponse);

  rpc UploadConcreteKeys(stream ConcreteKeyChunk) returns (ConcreteKeyUploadResponse);

  rpc UploadOpenFHESSKeys(stream OpenFHESSKeyChunk) returns (OpenFHESSKeyUploadResponse);
}

message ServiceProviderRequest {
  string method = 1;
  string path = 2;
  string json_payload = 3;
}

message ServiceProviderResponse {
  int32 status_code = 1;
  string json_payload = 2;
}

message ConcreteKeyChunk {
  bytes data = 1;
}

message ConcreteKeyUploadResponse {
  int32 status_code = 1;
  string json_payload = 2;
}

message OpenFHESSKeyChunk {
  bytes data = 1;
  string key_name = 2;
}

message OpenFHESSKeyUploadResponse {
  int32 status_code = 1;
  string json_payload = 2;
}